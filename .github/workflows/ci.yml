name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/PictureIt.sln

      - name: Build
        run: dotnet build src/PictureIt.sln -c Release --no-restore

      - name: Test
        run: dotnet test --solution src/PictureIt.sln -c Release --no-build
